name: Deploy homepage

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'favicon.svg'
      - 'privacy.html'
      - 'index.zh-CN.html'
      - 'privacy.zh-CN.html'
      - 'downloads/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html index.zh-CN.html privacy.html privacy.zh-CN.html styles.css favicon.svg _site/
          cp -R downloads _site/
      - name: Upload homepage
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy homepage
        id: deployment
        uses: actions/deploy-pages@v4
